name: Build Reader Edition

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Restore stable signing key
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: lodge-book-narrator-signing-v1

      - name: Create signing key if missing
        shell: bash
        run: |
          mkdir -p ~/.android
          if [ ! -f ~/.android/debug.keystore ]; then
            keytool -genkeypair -v \
              -keystore ~/.android/debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Lodge Marketing Machine Reader, OU=Publishing, O=The Lodge Marketing Machine, L=Leeds, ST=West Yorkshire, C=GB"
          fi

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build Reader Edition base APK
        run: gradle clean assembleDebug

      - name: Verify base APK signature
        shell: bash
        run: |
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)
          "$APKSIGNER" verify --verbose --print-certs app/build/outputs/apk/debug/app-debug.apk

      - name: Package Android signing tools
        shell: bash
        run: |
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)
          BUILD_TOOLS_DIR=$(dirname "$APKSIGNER")
          mkdir -p signing-tools/lib
          cp "$BUILD_TOOLS_DIR/apksigner" signing-tools/
          cp "$BUILD_TOOLS_DIR/zipalign" signing-tools/
          cp "$BUILD_TOOLS_DIR/lib/apksigner.jar" signing-tools/lib/
          chmod +x signing-tools/apksigner signing-tools/zipalign
          tar -czf android-signing-tools.tar.gz signing-tools

      - name: Upload Reader Edition base APK
        uses: actions/upload-artifact@v4
        with:
          name: LodgeMarketingMachine-Reader-Base
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Upload Android signing tools
        uses: actions/upload-artifact@v4
        with:
          name: Android-Signing-Tools
          path: android-signing-tools.tar.gz
          if-no-files-found: error
