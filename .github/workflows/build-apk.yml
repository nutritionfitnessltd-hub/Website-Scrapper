name: Build Selectable Media Reader

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Restore stable signing key
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: lodge-book-narrator-signing-v1

      - name: Create signing key if missing
        shell: bash
        run: |
          mkdir -p ~/.android
          if [ ! -f ~/.android/debug.keystore ]; then
            keytool -genkeypair -v \
              -keystore ~/.android/debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Lodge Book Reader, OU=Publishing, O=The Lodge Marketing Machine, L=Leeds, ST=West Yorkshire, C=GB"
          fi

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        run: gradle clean assembleDebug

      - name: Verify APK signature
        shell: bash
        run: |
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -type f -name apksigner -print -quit)
          "$APKSIGNER" verify --verbose --print-certs app/build/outputs/apk/debug/app-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: LodgeBookReader-Choose-Files
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
