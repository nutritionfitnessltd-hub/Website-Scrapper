    compileSdk 35

    defaultConfig {
        applicationId 'com.lodgemarketingmachine.reader.external'
        minSdk 26
        targetSdk 35
        versionCode 2
        versionName '1.0.1'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}
