plugins { id 'com.android.application' }

android {
    namespace 'com.lodgemarketingmachine.narrator'
    compileSdk 35

    defaultConfig {
        applicationId 'com.lodgemarketingmachine.narrator.player'
        minSdk 26
        targetSdk 35
        versionCode 6
        versionName '1.5.0'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}
